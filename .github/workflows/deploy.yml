name: Deploy

on:
  # manually deploy the selected branch
  workflow_dispatch:

  # pushed to main
  push:
    branches:
      - main

  # pull request to master is closed
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.repository_owner == 'nitoyon' && github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - run: npm ci
    - run: npm test
    - run: npm run build

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
